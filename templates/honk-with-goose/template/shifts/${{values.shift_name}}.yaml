# See manifest documentation for details:
# https://backstage.spotify.net/docs/default/system/fleetshift-system/shift-manifest/shift-manifest-reference-guide/#shift-manifest-reference-guide
apiVersion: fleetshift.spotify.com/v1
kind: Shift
metadata:
  name: "${{ values.shift_name }}"
  namespace: genai-migration-experiment
  annotations:
    spotify.com/owner: "${{ values.owner }}"
    spotify.com/description: |
      ${{ values.description }}
spec:
  # We run under the standard fleetshift service account. This simplifies permission managment.
  shiftIdentityOptOut: true
  containers:

    # Honk does not run as root. First we own the workdir to make sure we can write to it.
    - name: chown-non-root
      image: gcr.io/spotify-base-images/noble:2025.2-2
      command: ["sh", "-c", "chown -R 1042:3042 /workdir && ls -la /workdir"]

    # This is where honk runs. Configure Honk in args.
    - name: honk
      image: gcr.io/genai-migration-experiment/gaggle:latest
      args:
        [
          "--no-goose-in-docker",
          "run",
          "gs://honk-plans/instructions/${{ values.shift_name }}/instructions.md",
        ]
      nonRootUser: true

    # Move ownership of the workdir back to root. git needs this.
    - name: chown-root
      image: gcr.io/spotify-base-images/noble:2025.2-2
      command: ["sh", "-c", "chown -R 0:0 /workdir && ls -la /workdir"]

  pullRequest:
    title: "ai-migration: ${{ values.shift_name }}"
    description: |
      ${{ values.description }}

      🪿 This PR has been created by honk based on the [${{ values.shift_name }} plan](https://ghe.spotify.net/genai-migration/ai-migrations/tree/master/instructions/${{ values.shift_name }})
    commitMessage: "${{ values.shift_name }}: honk!"

  rollout:
    createCodeChanges: true
    createPullRequests: false # enable when ready to rollout to customers

  # For how to write target queries, see:
  # https://backstage.spotify.net/docs/default/system/fleetshift-system/targeting-repositories/directory-level-targeting/
  targets:
    # Use to target just one repo for testing purposes:
    in:
      repositories:
        - starfleet/starfleet-test-service
    where:
      allMatch:
        - component:
            type: service
            lifecycle: experimental
            # Uncomment to target only a specific system or owner
            # system: honk
            # owner: honk-users
        - subpath:
            at: "**/*.java"
            withContentsMatching: "BaseEncoding.base64()"
    unless:
      inList:
        - repository: genai-migration/ai-migrations
