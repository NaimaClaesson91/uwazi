apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPartialPolicy
metadata:
  name: ai-migrations-iam-honk-telemetry-writer
  namespace: genai-migration-experiment
spec:
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Project
    external: "projects/genai-migration-experiment"
  bindings:
  - role: roles/storage.objectCreator
    condition:
      expression: 'resource.name.startsWith("projects/_/buckets/honk-telemetry")'
      title: "Write permissions on honk-telemetry bucket"
      description: "Write permissions on honk-telemetry bucket for Fleetshift SA"
    members:
    - member:
        serviceAccount:tycoon-job-account@fleetshift.iam.gserviceaccount.com
