version: 2
useBuildIdentity: true

template:
  type: declarativeInfra
  declarativeInfra:
      enabled: true
      experimentalManifestDir: ["kubernetes","shifts"]

environment:
  - ref: ".*"
    envs:
      CODEMOD_IMAGE: ai-migrations


notifications:
  - ref: refs/heads/master
    failure:
      slack:
        - $author
  - ref: refs/pull/.*/merge
    failure:
      slack:
        - $author
