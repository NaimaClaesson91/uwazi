# See manifest documentation for details:
# https://backstage.spotify.net/docs/default/system/fleetshift-system/shift-manifest/shift-manifest-reference-guide/#shift-manifest-reference-guide
apiVersion: fleetshift.spotify.com/v1
kind: Shift
metadata:
  name: ai-migrations
  namespace: genai-migration-experiment
  annotations:
    spotify.com/owner: ssa
    spotify.com/description: Central location of AI powered fleet shifts for migrations and other fleet wide changes.
spec:
  shiftIdentityOptOut: true
  containers:
    - name: chown
      image: gcr.io/spotify-base-images/focal:2025.2-2@sha256:00173375dfaedc4e0e85c59ea7ef0bb4a51cc29df3ac8d0253548725a1ce3c58
      command: [
        'sh',
        '-c',
        'chown -R 1042:3042 /workdir',
      ]
    - name: honk
      image: gcr.io/genai-migration-experiment/gaggle:20250313093853-463dc7fa
      args: ["--no-goose-in-docker", "gs://honk-plans/update-service-info.md", "--model=o3-mini"]

  pullRequest:
    title: Example AI generated Pull Request
    description: |
      The is an example AI migration.
    commitMessage: Honk honk!

  rollout:
    createCodeChanges: true
    createPullRequests: false

  targetRepositories:
    - repo: starfleet/starfleet-test-service